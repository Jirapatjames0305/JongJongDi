<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ – JongJongDi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb !important;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    a {
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- Top logo link -->
  <a href="index.html"
    style="position:fixed;top:16px;left:24px;display:flex;align-items:center;gap:8px;text-decoration:none;z-index:10;">
    <div
      style="width:32px;height:32px;background:#2563eb;border-radius:8px;display:flex;align-items:center;justify-content:center;">
      <i class="fa-solid fa-calendar-check" style="color:#fff;font-size:16px;"></i>
    </div>
    <span style="font-weight:700;color:#1e293b;font-size:15px;">JongJongDi</span>
  </a>

  <!-- Card -->
  <div style="width:100%;max-width:420px;">

    <!-- Logo + Title -->
    <div style="text-align:center;margin-bottom:28px;">
      <div
        style="width:64px;height:64px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(37,99,235,0.3);">
        <i class="fa-solid fa-calendar-check" style="color:#fff;font-size:28px;"></i>
      </div>
      <h1 style="font-size:24px;font-weight:700;color:#1e293b;margin-bottom:6px;">เข้าสู่ระบบ</h1>
      <p id="subtitle" style="font-size:14px;color:#64748b;"></p>
    </div>

    <!-- Form card -->
    <div style="background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.08);padding:32px;">

      <!-- Error box -->
      <div id="error-box"
        style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;margin-bottom:20px;color:#dc2626;font-size:13px;">
        <i class="fa-solid fa-circle-exclamation" style="margin-right:8px;"></i>
        <span id="error-msg"></span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">

        <!-- Phone -->
        <div style="margin-bottom:16px;">
          <label id="lbl-phone"
            style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-phone"
              style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="phone" type="tel" required autocomplete="tel"
              style="width:100%;padding:12px 14px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;"
              placeholder="08x-xxx-xxxx">
          </div>
        </div>

        <!-- Password -->
        <div style="margin-bottom:24px;">
          <label id="lbl-password"
            style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-lock"
              style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="password" type="password" required autocomplete="current-password"
              style="width:100%;padding:12px 44px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;">
            <button type="button" onclick="togglePwd()"
              style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:14px;padding:4px;">
              <i id="pwd-eye" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
          style="width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-family:'Prompt',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;display:flex;align-items:center;justify-content:center;gap:8px;"
          onmouseover="this.style.background='#1d4ed8'" onmouseout="if(!this.disabled)this.style.background='#2563eb'">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span id="submit-label"></span>
        </button>

      </form>
    </div>

    <!-- Links below card -->
    <div style="text-align:center;margin-top:20px;display:flex;flex-direction:column;gap:12px;">
      <p style="font-size:14px;color:#64748b;">
        <span id="lbl-no-account"></span>
        <a id="link-register" href="register.html" style="color:#2563eb;font-weight:600;margin-left:6px;"></a>
      </p>
    </div>

  </div>

  <script src="_lib.js"></script>
  <script>
    const lang = getLang();

    // Redirect if already logged in
    if (getUserSession()) {
      location.href = getQP('redirect') || 'index.html';
    }

    // Populate i18n
    document.getElementById('subtitle').textContent = tx(t.login.subtitle, lang);
    document.getElementById('lbl-phone').textContent = tx(t.login.phone, lang);
    document.getElementById('lbl-password').textContent = tx(t.login.password, lang);
    document.getElementById('submit-label').textContent = tx(t.login.submit, lang);
    document.getElementById('lbl-no-account').textContent = tx(t.login.noAccount, lang);
    document.getElementById('link-register').textContent = tx(t.login.signUp, lang);
    document.getElementById('link-back').textContent = tx(t.login.back, lang);

    // Preserve redirect param on register link
    const redirect = getQP('redirect');
    if (redirect) {
      document.getElementById('link-register').href = `register.html?redirect=${encodeURIComponent(redirect)}`;
    }

    function togglePwd() {
      const input = document.getElementById('password');
      const eye = document.getElementById('pwd-eye');
      if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        eye.className = 'fa-solid fa-eye';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      document.getElementById('error-msg').textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    async function handleLogin(e) {
      e.preventDefault();
      hideError();

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('submit-btn');
      const label = document.getElementById('submit-label');

      btn.disabled = true;
      btn.style.background = '#93c5fd';
      btn.style.cursor = 'not-allowed';
      label.textContent = tx(t.login.loading, lang);

      try {
        const data = await userLogin(phone, password);
        saveUserSession(data.token, data.user);
        showToast(lang === 'en' ? 'Logged in successfully!' : 'เข้าสู่ระบบสำเร็จ!');
        setTimeout(() => {
          location.href = getQP('redirect') || 'index.html';
        }, 600);
      } catch (err) {
        showError(err.message || tx(t.login.error, lang));
        btn.disabled = false;
        btn.style.background = '#2563eb';
        btn.style.cursor = 'pointer';
        label.textContent = tx(t.login.submit, lang);
      }
    }
  </script>
</body>

</html>
