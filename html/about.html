<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เกี่ยวกับเรา - JongJongDi</title>
  <meta name="description" content="เกี่ยวกับ JongJongDi แพลตฟอร์มจองที่พักและทัวร์ที่คุณวางใจ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="_lib.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Prompt',sans-serif;color:#334155;background:#fff;-webkit-font-smoothing:antialiased;}
    a{text-decoration:none;}
    html{scroll-behavior:smooth;}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
    .fade-in{animation:fadeInUp .8s ease-out;}
    @media(max-width:768px){
      #nav-links{display:none!important;}
      .values-grid{grid-template-columns:1fr!important;}
      .stats-grid{grid-template-columns:repeat(2,1fr)!important;}
      .cta-btns{flex-direction:column!important;align-items:stretch!important;}
    }
    @media(max-width:480px){
      .stats-grid{grid-template-columns:repeat(2,1fr)!important;}
    }
  </style>
</head>
<body>

<!-- ─── Main ──────────────────────────────────────────────────────────────── -->
<main style="padding-top:64px;">

  <!-- ─── Hero ──────────────────────────────────────────────────────────── -->
  <section style="position:relative;background:linear-gradient(135deg,#1d4ed8 0%,#0f172a 100%);min-height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:64px 16px;">
    <!-- Decorative blur circles -->
    <div style="position:absolute;top:-80px;left:-80px;width:320px;height:320px;background:rgba(37,99,235,.35);border-radius:50%;filter:blur(80px);pointer-events:none;"></div>
    <div style="position:absolute;bottom:-60px;right:-60px;width:260px;height:260px;background:rgba(245,158,11,.2);border-radius:50%;filter:blur(70px);pointer-events:none;"></div>
    <div style="position:absolute;top:40%;left:60%;width:180px;height:180px;background:rgba(96,165,250,.15);border-radius:50%;filter:blur(60px);pointer-events:none;"></div>

    <div class="fade-in" style="position:relative;z-index:1;text-align:center;max-width:680px;">
      <!-- Chip -->
      <div id="hero-chip" style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:9999px;padding:6px 18px;font-size:12px;color:rgba(255,255,255,.9);margin-bottom:24px;backdrop-filter:blur(4px);">
        <i class="fa-solid fa-circle-info" style="color:#f59e0b;"></i>
        <span></span>
      </div>

      <!-- Title -->
      <h1 style="font-size:clamp(28px,5vw,52px);font-weight:700;color:#fff;line-height:1.2;margin-bottom:16px;">
        จองจองดิ<br>
        <span id="hero-highlight" style="color:#f59e0b;"></span>
      </h1>

      <!-- Subtitle -->
      <p id="hero-subtitle" style="color:rgba(255,255,255,.75);font-size:clamp(14px,2vw,17px);line-height:1.7;max-width:560px;margin:0 auto;"></p>
    </div>
  </section>

  <!-- ─── Stats bar ─────────────────────────────────────────────────────── -->
  <section style="background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:32px 16px;">
    <div style="max-width:900px;margin:0 auto;">
      <div class="stats-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
        <div style="text-align:center;padding:16px;">
          <div style="font-size:clamp(24px,4vw,36px);font-weight:700;color:#2563eb;">500+</div>
          <div id="stat1" style="font-size:13px;color:#64748b;margin-top:4px;"></div>
        </div>
        <div style="text-align:center;padding:16px;">
          <div style="font-size:clamp(24px,4vw,36px);font-weight:700;color:#2563eb;">120+</div>
          <div id="stat2" style="font-size:13px;color:#64748b;margin-top:4px;"></div>
        </div>
        <div style="text-align:center;padding:16px;">
          <div style="font-size:clamp(24px,4vw,36px);font-weight:700;color:#2563eb;">10,000+</div>
          <div id="stat3" style="font-size:13px;color:#64748b;margin-top:4px;"></div>
        </div>
        <div style="text-align:center;padding:16px;">
          <div style="font-size:clamp(24px,4vw,36px);font-weight:700;color:#f59e0b;">4.9★</div>
          <div id="stat4" style="font-size:13px;color:#64748b;margin-top:4px;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ─── Story section ────────────────────────────────────────────────── -->
  <section style="padding:64px 16px;max-width:760px;margin:0 auto;">
    <div style="margin-bottom:32px;">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
        <div style="width:4px;height:32px;background:#2563eb;border-radius:9999px;"></div>
        <h2 id="story-title" style="font-size:clamp(20px,3vw,28px);font-weight:700;color:#0f172a;"></h2>
      </div>
      <div id="story-body" style="display:flex;flex-direction:column;gap:20px;font-size:15px;line-height:1.8;color:#475569;"></div>
    </div>
  </section>

  <!-- ─── Values section ───────────────────────────────────────────────── -->
  <section style="background:#f8fafc;padding:64px 16px;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;">
    <div style="max-width:900px;margin:0 auto;">
      <div style="text-align:center;margin-bottom:40px;">
        <h2 id="values-title" style="font-size:clamp(20px,3vw,28px);font-weight:700;color:#0f172a;margin-bottom:8px;"></h2>
        <div style="width:48px;height:4px;background:#2563eb;border-radius:9999px;margin:0 auto;"></div>
      </div>
      <div class="values-grid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:20px;" id="values-grid"></div>
    </div>
  </section>

  <!-- ─── CTA section ──────────────────────────────────────────────────── -->
  <section style="background:linear-gradient(135deg,#2563eb 0%,#1d4ed8 100%);padding:64px 16px;text-align:center;">
    <div style="max-width:600px;margin:0 auto;">
      <h2 id="cta-title" style="font-size:clamp(20px,3vw,30px);font-weight:700;color:#fff;margin-bottom:12px;"></h2>
      <p id="cta-subtitle" style="color:rgba(255,255,255,.8);font-size:15px;margin-bottom:32px;line-height:1.6;"></p>
      <div class="cta-btns" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="rooms.html" id="cta-btn1" style="display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:#fff;color:#2563eb;border-radius:10px;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.15);"></a>
        <a href="terms.html" id="cta-btn2" style="display:inline-flex;align-items:center;gap:8px;padding:14px 28px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:10px;font-weight:600;font-size:15px;backdrop-filter:blur(4px);"></a>
      </div>
    </div>
  </section>

</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const lang = getLang();
  const isTh = lang !== 'en';

  // ── Hero ────────────────────────────────────────────────────────────────
  document.querySelector('#hero-chip span').textContent = isTh ? 'เกี่ยวกับเรา' : 'About Us';
  document.getElementById('hero-highlight').textContent = isTh
    ? 'เพราะทุกทริปควรสมบูรณ์แบบ'
    : 'Because Every Trip Deserves to Be Perfect';
  document.getElementById('hero-subtitle').textContent = isTh
    ? 'แพลตฟอร์มจองที่พักและทัวร์สำหรับนักเดินทางชาวไทย ครบ ง่าย วางใจได้ในทุกการเดินทาง'
    : 'Thailand\'s booking platform for travelers — complete, simple, and trustworthy for every journey.';

  // ── Stats ───────────────────────────────────────────────────────────────
  document.getElementById('stat1').textContent = isTh ? 'ที่พักทั่วไทย' : 'Properties';
  document.getElementById('stat2').textContent = isTh ? 'ทัวร์ดำน้ำ' : 'Dive Tours';
  document.getElementById('stat3').textContent = isTh ? 'การจองทั้งหมด' : 'Bookings';
  document.getElementById('stat4').textContent = isTh ? 'คะแนนเฉลี่ย' : 'Avg Rating';

  // ── Story ───────────────────────────────────────────────────────────────
  document.getElementById('story-title').textContent = isTh ? 'เรื่องราวของเรา' : 'Our Story';

  const paragraphs = isTh ? [
    'JongJongDi เริ่มต้นจากความต้องการที่แท้จริง — นักเดินทางชาวไทยสมควรได้รับแพลตฟอร์มที่เข้าใจพวกเขา ไม่ใช่แค่แปลมาจากภาษาอื่น ทีมงานของเราเชื่อว่าการจองที่พักหรือทัวร์ควรจะง่ายและรวดเร็วเหมือนการสั่งอาหารออนไลน์',
    'เราสร้าง JongJongDi ด้วยหลักการเดียว: ความเรียบง่าย ไม่มีขั้นตอนซับซ้อน ไม่มีค่าธรรมเนียมซ่อนเร้น แค่ค้นหา จอง และออกเดินทาง ระบบของเราถูกออกแบบมาให้ทำงานได้ดีทั้งบนมือถือและคอมพิวเตอร์ เพราะเราเข้าใจว่าคุณวางแผนทริปในทุกที่ทุกเวลา',
    'ปัจจุบัน JongJongDi มีพาร์ทเนอร์มากกว่า 200 แห่งทั่วประเทศไทย ครอบคลุมทั้งที่พัก รีสอร์ท และทัวร์ทางทะเล เราภูมิใจที่ได้รับความไว้วางใจจากลูกค้ากว่า 10,000 การจอง และยังคงเติบโตต่อเนื่องในทุกวัน',
  ] : [
    'JongJongDi started from a genuine need — Thai travelers deserve a platform that truly understands them, not just a translation. Our team believes that booking accommodations or tours should be as easy and fast as ordering food online.',
    'We built JongJongDi on one principle: simplicity. No complicated steps, no hidden fees. Just search, book, and go. Our system is designed to work seamlessly on both mobile and desktop, because we know you plan trips anytime, anywhere.',
    'Today, JongJongDi has over 200 partners across Thailand, covering hotels, resorts, and sea tours. We\'re proud to have earned the trust of over 10,000 bookings and continue to grow every day.',
  ];
  document.getElementById('story-body').innerHTML = paragraphs.map(p =>
    `<p style="padding:20px 24px;background:#f8fafc;border-radius:12px;border-left:4px solid #2563eb;">${p}</p>`
  ).join('');

  // ── Values ──────────────────────────────────────────────────────────────
  document.getElementById('values-title').textContent = isTh ? 'คุณค่าที่เราเชื่อมั่น' : 'What We Stand For';

  const values = [
    {
      icon: 'fa-shield-halved',
      color: '#2563eb',
      bg: '#eff6ff',
      title: isTh ? 'ความน่าเชื่อถือ' : 'Trust',
      desc: isTh
        ? 'ทุกที่พักและทัวร์ผ่านการตรวจสอบคุณภาพก่อนนำขึ้นแพลตฟอร์ม คุณมั่นใจได้ทุกการจอง'
        : 'Every property and tour is quality-checked before listing. You can trust every booking.',
    },
    {
      icon: 'fa-bolt',
      color: '#d97706',
      bg: '#fffbeb',
      title: isTh ? 'รวดเร็ว' : 'Speed',
      desc: isTh
        ? 'จองเสร็จภายในไม่กี่ขั้นตอน ได้รับการยืนยันทันที ไม่ต้องรอนาน'
        : 'Complete a booking in just a few steps. Instant confirmation, no waiting around.',
    },
    {
      icon: 'fa-headset',
      color: '#16a34a',
      bg: '#f0fdf4',
      title: isTh ? 'บริการ 24/7' : 'Support 24/7',
      desc: isTh
        ? 'ทีมงานพร้อมช่วยเหลือคุณตลอด 24 ชั่วโมง ทุกวัน ไม่มีวันหยุด'
        : 'Our team is ready to help you 24 hours a day, every day, no days off.',
    },
    {
      icon: 'fa-hand-holding-heart',
      color: '#dc2626',
      bg: '#fef2f2',
      title: isTh ? 'ใส่ใจทุกการเดินทาง' : 'Care',
      desc: isTh
        ? 'เราไม่ได้แค่ขายการจอง แต่เราดูแลให้ทริปของคุณสมบูรณ์แบบตั้งแต่ต้นจนจบ'
        : 'We don\'t just sell bookings — we care about making your entire trip perfect from start to finish.',
    },
  ];

  document.getElementById('values-grid').innerHTML = values.map(v => `
    <div style="background:#fff;border-radius:16px;padding:28px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.05);display:flex;gap:20px;align-items:flex-start;">
      <div style="width:52px;height:52px;border-radius:14px;background:${v.bg};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fa-solid ${v.icon}" style="color:${v.color};font-size:22px;"></i>
      </div>
      <div>
        <h3 style="font-weight:700;font-size:16px;color:#0f172a;margin-bottom:8px;">${v.title}</h3>
        <p style="font-size:14px;color:#64748b;line-height:1.65;">${v.desc}</p>
      </div>
    </div>
  `).join('');

  // ── CTA ─────────────────────────────────────────────────────────────────
  document.getElementById('cta-title').textContent = isTh
    ? 'พร้อมเริ่มต้นทริปในฝันของคุณ?'
    : 'Ready to Start Your Dream Trip?';
  document.getElementById('cta-subtitle').textContent = isTh
    ? 'ค้นหาที่พักและทัวร์ที่ดีที่สุดได้เลยตอนนี้ ง่าย เร็ว และคุ้มค่า'
    : 'Find the best accommodations and tours right now. Easy, fast, and great value.';
  document.getElementById('cta-btn1').innerHTML =
    `<i class="fa-solid fa-magnifying-glass"></i>${isTh ? 'ค้นหาที่พัก' : 'Browse Properties'}`;
  document.getElementById('cta-btn2').innerHTML =
    `<i class="fa-solid fa-file-lines"></i>${isTh ? 'ข้อกำหนดและเงื่อนไข' : 'Terms & Conditions'}`;

  // ── Navbar + Footer ─────────────────────────────────────────────────────
  initPage({ base: '' });
});
</script>

</body>
</html>
