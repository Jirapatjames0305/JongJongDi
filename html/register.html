<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก – JongJongDi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    input:focus { outline: none; border-color: #2563eb !important; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    a { text-decoration: none; }
  </style>
</head>
<body>

  <!-- Top logo link -->
  <a href="index.html" style="position:fixed;top:16px;left:24px;display:flex;align-items:center;gap:8px;text-decoration:none;z-index:10;">
    <div style="width:32px;height:32px;background:#2563eb;border-radius:8px;display:flex;align-items:center;justify-content:center;">
      <i class="fa-solid fa-calendar-check" style="color:#fff;font-size:16px;"></i>
    </div>
    <span style="font-weight:700;color:#1e293b;font-size:15px;">JongJongDi</span>
  </a>

  <div style="width:100%;max-width:440px;">

    <!-- Logo + Title -->
    <div style="text-align:center;margin-bottom:24px;">
      <div style="width:64px;height:64px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 8px 24px rgba(37,99,235,0.3);">
        <i class="fa-solid fa-user-plus" style="color:#fff;font-size:26px;"></i>
      </div>
      <h1 style="font-size:24px;font-weight:700;color:#1e293b;margin-bottom:6px;">สมัครสมาชิก</h1>
      <p id="subtitle" style="font-size:14px;color:#64748b;"></p>
    </div>

    <!-- Referral banner (shown if ?ref= param present) -->
    <div id="ref-banner" style="display:none;background:linear-gradient(135deg,#2563eb,#1d4ed8);border-radius:16px;padding:16px 20px;margin-bottom:20px;color:#fff;display:flex;align-items:center;gap:14px;">
      <div style="width:44px;height:44px;background:rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fa-solid fa-gift" style="font-size:20px;color:#fde68a;"></i>
      </div>
      <div>
        <div id="ref-banner-title" style="font-weight:700;font-size:15px;margin-bottom:2px;"></div>
        <div id="ref-banner-desc" style="font-size:13px;opacity:0.9;"></div>
      </div>
    </div>

    <!-- Form card -->
    <div style="background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.08);padding:32px;">

      <!-- Error box -->
      <div id="error-box" style="display:none;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px 16px;margin-bottom:20px;color:#dc2626;font-size:13px;">
        <i class="fa-solid fa-circle-exclamation" style="margin-right:8px;"></i>
        <span id="error-msg"></span>
      </div>

      <form id="register-form" onsubmit="handleRegister(event)">

        <!-- Full Name -->
        <div style="margin-bottom:14px;">
          <label id="lbl-name" style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-user" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="name" type="text" required autocomplete="name"
              style="width:100%;padding:12px 14px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;"
              placeholder="">
          </div>
        </div>

        <!-- Phone -->
        <div style="margin-bottom:14px;">
          <label id="lbl-phone" style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-phone" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="phone" type="tel" required autocomplete="tel"
              style="width:100%;padding:12px 14px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;"
              placeholder="08x-xxx-xxxx">
          </div>
        </div>

        <!-- Email -->
        <div style="margin-bottom:14px;">
          <label id="lbl-email" style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-envelope" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="email" type="email" autocomplete="email"
              style="width:100%;padding:12px 14px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;"
              placeholder="example@email.com">
          </div>
        </div>

        <!-- Password -->
        <div style="margin-bottom:14px;">
          <label id="lbl-password" style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="password" type="password" required autocomplete="new-password" minlength="6"
              style="width:100%;padding:12px 44px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;">
            <button type="button" onclick="togglePwd('password','eye1')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:14px;padding:4px;">
              <i id="eye1" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div style="margin-bottom:14px;">
          <label id="lbl-confirm" style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-lock" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="confirm-password" type="password" required autocomplete="new-password"
              style="width:100%;padding:12px 44px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;transition:border-color .2s,box-shadow .2s;">
            <button type="button" onclick="togglePwd('confirm-password','eye2')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#94a3b8;font-size:14px;padding:4px;">
              <i id="eye2" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Referral Code -->
        <div style="margin-bottom:24px;">
          <label id="lbl-ref" style="display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;"></label>
          <div style="position:relative;">
            <i class="fa-solid fa-ticket" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;"></i>
            <input id="referral-code" type="text" autocomplete="off"
              oninput="this.value=this.value.toUpperCase()"
              style="width:100%;padding:12px 14px 12px 40px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:14px;color:#1e293b;letter-spacing:2px;transition:border-color .2s,box-shadow .2s;"
              placeholder="">
          </div>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
          style="width:100%;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-family:'Prompt',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px;"
          onmouseover="this.style.background='#1d4ed8'" onmouseout="if(!this.disabled)this.style.background='#2563eb'">
          <i class="fa-solid fa-user-plus"></i>
          <span id="submit-label"></span>
        </button>

      </form>
    </div>

    <!-- Links below card -->
    <div style="text-align:center;margin-top:20px;display:flex;flex-direction:column;gap:12px;">
      <p style="font-size:14px;color:#64748b;">
        <span id="lbl-has-account"></span>
        <a id="link-login" href="login.html" style="color:#2563eb;font-weight:600;margin-left:6px;"></a>
      </p>
      <a href="index.html" style="font-size:13px;color:#94a3b8;display:flex;align-items:center;justify-content:center;gap:6px;">
        <i class="fa-solid fa-arrow-left"></i>
        <span id="link-back"></span>
      </a>
    </div>

  </div>

  <script src="_lib.js"></script>
  <script>
    const lang = getLang();

    // Redirect if already logged in
    if (getUserSession()) {
      location.href = getQP('redirect') || 'index.html';
    }

    // Populate i18n
    document.getElementById('subtitle').textContent = tx(t.register.subtitle, lang);
    document.getElementById('lbl-name').textContent = tx(t.register.name, lang);
    document.getElementById('name').placeholder = tx(t.register.namePh, lang);
    document.getElementById('lbl-phone').textContent = tx(t.register.phone, lang);
    document.getElementById('lbl-email').textContent = tx(t.register.email, lang);
    document.getElementById('lbl-password').textContent = tx(t.register.password, lang);
    document.getElementById('lbl-confirm').textContent = tx(t.register.confirmPassword, lang);
    document.getElementById('lbl-ref').textContent = tx(t.register.referralCode, lang);
    document.getElementById('referral-code').placeholder = tx(t.register.referralPh, lang);
    document.getElementById('submit-label').textContent = tx(t.register.submit, lang);
    document.getElementById('lbl-has-account').textContent = tx(t.register.hasAccount, lang);
    document.getElementById('link-login').textContent = tx(t.register.loginLink, lang);
    document.getElementById('link-back').textContent = tx(t.register.back, lang);

    // Referral param
    const ref = getQP('ref');
    if (ref) {
      document.getElementById('referral-code').value = ref.toUpperCase();
      const banner = document.getElementById('ref-banner');
      banner.style.display = 'flex';
      document.getElementById('ref-banner-title').textContent = tx(t.register.refBannerTitle, lang);
      document.getElementById('ref-banner-desc').textContent = tx(t.register.refBannerDesc, lang);
    }

    // Redirect param passthrough on login link
    const redirect = getQP('redirect');
    if (redirect) {
      document.getElementById('link-login').href = `login.html?redirect=${encodeURIComponent(redirect)}`;
    }

    function togglePwd(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye = document.getElementById(eyeId);
      if (input.type === 'password') {
        input.type = 'text';
        eye.className = 'fa-solid fa-eye-slash';
      } else {
        input.type = 'password';
        eye.className = 'fa-solid fa-eye';
      }
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      document.getElementById('error-msg').textContent = msg;
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    async function handleRegister(e) {
      e.preventDefault();
      hideError();

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPwd = document.getElementById('confirm-password').value;
      const referralCode = document.getElementById('referral-code').value.trim();

      // Validate
      if (password.length < 6) { showError(tx(t.register.errShort, lang)); return; }
      if (password !== confirmPwd) { showError(tx(t.register.errMismatch, lang)); return; }

      const btn = document.getElementById('submit-btn');
      const label = document.getElementById('submit-label');
      btn.disabled = true;
      btn.style.background = '#93c5fd';
      btn.style.cursor = 'not-allowed';
      label.textContent = tx(t.register.loading, lang);

      try {
        const payload = { name, phone, password };
        if (email) payload.email = email;
        if (referralCode) payload.referralCode = referralCode;

        const data = await userRegister(payload);
        saveUserSession(data.token, data.user);
        showToast(lang === 'en' ? 'Account created successfully!' : 'สมัครสมาชิกสำเร็จ!');

        setTimeout(() => {
          if (referralCode) {
            location.href = redirect || 'profile.html?tab=coupons';
          } else {
            location.href = redirect || 'index.html';
          }
        }, 600);
      } catch (err) {
        showError(err.message || tx(t.register.errDefault, lang));
        btn.disabled = false;
        btn.style.background = '#2563eb';
        btn.style.cursor = 'pointer';
        label.textContent = tx(t.register.submit, lang);
      }
    }
  </script>
</body>
</html>
