<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JongJongDi - ติดตามการจอง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="_lib.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Prompt',sans-serif;color:#334155;background:#f8fafc;-webkit-font-smoothing:antialiased;}
    a{text-decoration:none;}
    #phone-input{width:100%;padding:14px 18px;border:2px solid #e2e8f0;border-radius:12px;font-family:'Prompt',sans-serif;font-size:16px;color:#334155;background:#fff;outline:none;transition:border-color .2s;}
    #phone-input:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.1);}
    @media(max-width:768px){#nav-links{display:none!important;}}
  </style>
</head>
<body>

<div style="padding-top:80px;min-height:100vh;">

  <!-- Search section -->
  <div style="background:linear-gradient(135deg,#eff6ff 0%,#f0fdf4 100%);padding:56px 16px 48px;text-align:center;border-bottom:1px solid #e2e8f0;">
    <div style="max-width:520px;margin:0 auto;">
      <div style="width:64px;height:64px;background:#2563eb;border-radius:16px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,99,235,.3);">
        <i class="fa-solid fa-magnifying-glass" style="font-size:28px;color:#fff;"></i>
      </div>
      <h1 id="track-title" style="font-size:clamp(22px,5vw,32px);font-weight:700;color:#1e293b;margin-bottom:10px;"></h1>
      <p id="track-subtitle" style="font-size:14px;color:#64748b;margin-bottom:32px;"></p>

      <div style="display:flex;gap:10px;max-width:420px;margin:0 auto;">
        <div style="flex:1;position:relative;">
          <i class="fa-solid fa-phone" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;pointer-events:none;"></i>
          <input type="tel" id="phone-input" placeholder="0801234567" style="padding-left:40px;" onkeydown="if(event.key==='Enter')doSearch()">
        </div>
        <button onclick="doSearch()" id="search-btn" style="padding:14px 24px;background:#2563eb;color:#fff;border:none;border-radius:12px;font-family:'Prompt',sans-serif;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(37,99,235,.3);transition:background .2s;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
          <i class="fa-solid fa-magnifying-glass" style="margin-right:6px;"></i><span id="search-label"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div style="max-width:720px;margin:0 auto;padding:32px 16px 64px;" id="results-root">
    <!-- empty by default -->
  </div>

</div>

<script>
const lang = getLang();

document.addEventListener('DOMContentLoaded', () => {
  initPage({ base: '' });
  document.getElementById('track-title').textContent   = tx(t.track.title, lang);
  document.getElementById('track-subtitle').textContent = tx(t.track.subtitle, lang);
  document.getElementById('search-label').textContent   = tx(t.track.search, lang);

  // If phone passed in URL, auto-search
  const phoneQP = getQP('phone');
  if (phoneQP) {
    document.getElementById('phone-input').value = phoneQP;
    doSearch();
  }
});

async function doSearch() {
  const phone = document.getElementById('phone-input').value.trim();
  if (!phone) { document.getElementById('phone-input').focus(); return; }

  const btn     = document.getElementById('search-btn');
  const root    = document.getElementById('results-root');
  const origInner = btn.innerHTML;

  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
  root.innerHTML = `<div style="text-align:center;padding:40px 0;color:#94a3b8;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:28px;"></i></div>`;

  try {
    const res = await fetch(`${API}/api/bookings/track?phone=${encodeURIComponent(phone)}`);
    const data = res.ok ? await res.json() : null;
    const bookings = Array.isArray(data) ? data : (data?.bookings || []);

    if (!bookings.length) {
      root.innerHTML = renderEmpty(phone);
    } else {
      root.innerHTML = `
        <div style="margin-bottom:20px;display:flex;align-items:center;gap:8px;">
          <i class="fa-solid fa-list-check" style="color:#2563eb;font-size:16px;"></i>
          <span style="font-weight:600;color:#334155;font-size:15px;">${pick('พบ', 'Found', lang)} ${bookings.length} ${pick('รายการ', 'bookings', lang)}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;">
          ${bookings.map(b => renderCard(b)).join('')}
        </div>`;
    }
  } catch (err) {
    root.innerHTML = `
      <div style="text-align:center;padding:40px 20px;background:#fff;border-radius:16px;border:1px solid #f1f5f9;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:32px;color:#f59e0b;margin-bottom:12px;display:block;"></i>
        <p style="color:#64748b;font-size:14px;">${pick('เกิดข้อผิดพลาด กรุณาลองใหม่', 'An error occurred. Please try again.', lang)}</p>
      </div>`;
  }

  btn.disabled = false;
  btn.innerHTML = origInner;
}

function renderEmpty(phone) {
  return `
    <div style="text-align:center;padding:48px 24px;background:#fff;border-radius:20px;border:1px solid #f1f5f9;box-shadow:0 1px 6px rgba(0,0,0,.05);">
      <div style="width:72px;height:72px;background:#f1f5f9;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;">
        <i class="fa-solid fa-folder-open" style="font-size:32px;color:#cbd5e1;"></i>
      </div>
      <h3 style="font-weight:700;font-size:18px;color:#1e293b;margin-bottom:8px;">${tx(t.track.notFound, lang)} ${phone}</h3>
      <p style="font-size:13px;color:#64748b;margin-bottom:20px;line-height:1.6;">${tx(t.track.notFoundHint, lang)}</p>
      <div style="display:inline-flex;align-items:center;gap:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px 20px;">
        <i class="fa-solid fa-phone" style="color:#2563eb;"></i>
        <span style="font-size:14px;font-weight:600;color:#1e293b;">${tx(t.track.callUs, lang)}</span>
      </div>
    </div>`;
}

function renderCard(b) {
  const isRoom = b.type === 'ACCOMMODATION' || b.roomType;
  let itemName = '—';
  let dateInfo = '';

  if (isRoom) {
    const roomName  = b.room?.nameTh || b.room?.name || b.roomSlug || '';
    const typeName  = b.roomType?.nameTh || b.roomType?.name || '';
    itemName = [roomName, typeName].filter(Boolean).join(' · ');
    dateInfo = `${fmtDate(b.checkIn)} → ${fmtDate(b.checkOut)}`;
  } else {
    itemName = b.tour?.nameTh || b.tour?.name || b.tourSlug || '';
    const dep = b.schedule?.departureDate || b.departureDate;
    dateInfo = dep ? fmtDate(dep) : '';
  }

  return `
    <div style="background:#fff;border-radius:14px;border:1px solid #f1f5f9;box-shadow:0 1px 6px rgba(0,0,0,.05);padding:18px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;">
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;">
          <span style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:.06em;">
            <i class="fa-solid fa-hashtag" style="margin-right:2px;"></i>${b.bookingNumber}
          </span>
          ${statusBadge(b.status)}
        </div>
        <div style="font-weight:600;font-size:15px;color:#1e293b;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${itemName}</div>
        <div style="font-size:12px;color:#64748b;display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          ${dateInfo ? `<span><i class="fa-regular fa-calendar" style="margin-right:4px;color:#93c5fd;"></i>${dateInfo}</span>` : ''}
          <span><i class="fa-solid fa-user" style="margin-right:4px;color:#93c5fd;"></i>${b.numGuests || 1} ${tx(t.booking.guests, lang)}</span>
          ${b.totalAmount ? `<span style="font-weight:700;color:#f59e0b;font-size:14px;">${Number(b.totalAmount).toLocaleString()}.-</span>` : ''}
        </div>
      </div>
      <a href="booking-detail.html?num=${b.bookingNumber}" style="flex-shrink:0;padding:8px 18px;background:#2563eb;color:#fff;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px;" onmouseover="this.style.background='#1d4ed8'" onmouseout="this.style.background='#2563eb'">
        <i class="fa-solid fa-eye"></i>${pick('รายละเอียด', 'Details', lang)}
      </a>
    </div>`;
}
</script>
</body>
</html>
