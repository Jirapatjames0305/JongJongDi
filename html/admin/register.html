<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สมัครสมาชิก – JongJongDi Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Prompt', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 56px;
      height: 56px;
      background: #2563eb;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 4px 20px rgba(37,99,235,0.45);
    }
    .logo-icon i { color: #fff; font-size: 26px; }
    .logo-text { color: #fff; font-size: 20px; font-weight: 700; }
    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
    }
    .card h2 { margin: 0 0 6px; font-size: 21px; font-weight: 700; color: #0f172a; }
    .card .subtitle { margin: 0 0 18px; font-size: 13px; color: #64748b; }
    .info-box {
      background: #dbeafe;
      border: 1px solid #93c5fd;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      color: #1e40af;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin-bottom: 22px;
    }
    .info-box i { margin-top: 1px; flex-shrink: 0; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
      color: #0f172a;
      outline: none;
      background: #f8fafc;
      transition: border-color .2s;
    }
    input:focus { border-color: #2563eb; background: #fff; }
    .field { margin-bottom: 16px; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .pwd-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 15px;
      padding: 0;
      display: flex;
      align-items: center;
    }
    .pwd-toggle:hover { color: #2563eb; }
    .error-box {
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #dc2626;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .error-box.hidden { display: none; }
    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'Prompt', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { opacity: .65; cursor: not-allowed; }
    .link-row { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
    .link-row a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .link-row a:hover { text-decoration: underline; }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="logo-area">
    <div class="logo-icon"><i class="fa-solid fa-calendar-check"></i></div>
    <div class="logo-text">JongJongDi Admin</div>
  </div>

  <div class="card">
    <h2>สมัครเป็นผู้ประกอบการ</h2>
    <p class="subtitle">สร้างบัญชีเพื่อเริ่มลงที่พักหรือทัวร์ของคุณ</p>

    <div class="info-box">
      <i class="fa-solid fa-circle-info"></i>
      <span>บัญชีของคุณจะต้องรอการอนุมัติจากแอดมินก่อนจึงจะใช้งานได้เต็มรูปแบบ</span>
    </div>

    <div id="error-box" class="error-box hidden">
      <i class="fa-solid fa-circle-exclamation" style="margin-top:1px;flex-shrink:0"></i>
      <span id="error-msg"></span>
    </div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="name">ชื่อ-นามสกุล</label>
        <input type="text" id="name" name="name" placeholder="ชื่อ นามสกุล" required autocomplete="name" />
      </div>
      <div class="field">
        <label for="businessName">ชื่อธุรกิจ</label>
        <input type="text" id="businessName" name="businessName" placeholder="ชื่อธุรกิจหรือร้านของคุณ" required />
      </div>
      <div class="field">
        <label for="phone">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" name="phone" placeholder="08x-xxx-xxxx" required autocomplete="tel" />
      </div>
      <div class="field">
        <label for="email">อีเมล</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">รหัสผ่าน</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="อย่างน้อย 6 ตัวอักษร" required minlength="6" autocomplete="new-password" />
          <button type="button" class="pwd-toggle" id="pwd-toggle-1" aria-label="แสดง/ซ่อนรหัสผ่าน">
            <i class="fa-solid fa-eye" id="pwd-icon-1"></i>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">ยืนยันรหัสผ่าน</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="พิมพ์รหัสผ่านอีกครั้ง" required autocomplete="new-password" />
          <button type="button" class="pwd-toggle" id="pwd-toggle-2" aria-label="แสดง/ซ่อนรหัสผ่าน">
            <i class="fa-solid fa-eye" id="pwd-icon-2"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submit-btn">
        <div class="spinner" id="spinner"></div>
        <span id="btn-text">สมัครสมาชิก</span>
      </button>
    </form>

    <div class="link-row">
      มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a>
    </div>
  </div>

  <script src="_lib.js"></script>
  <script>
    // If already logged in, go to dashboard
    (function () {
      var s = getAdminSession();
      if (s && s.token) location.href = 'dashboard.html';
    })();

    // Password toggles
    function setupPwdToggle(inputId, btnId, iconId) {
      var input = document.getElementById(inputId);
      var icon = document.getElementById(iconId);
      document.getElementById(btnId).addEventListener('click', function () {
        var show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        icon.className = show ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
      });
    }
    setupPwdToggle('password', 'pwd-toggle-1', 'pwd-icon-1');
    setupPwdToggle('confirmPassword', 'pwd-toggle-2', 'pwd-icon-2');

    // Form submit
    document.getElementById('register-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      var name = document.getElementById('name').value.trim();
      var businessName = document.getElementById('businessName').value.trim();
      var phone = document.getElementById('phone').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var confirmPassword = document.getElementById('confirmPassword').value;

      var errorBox = document.getElementById('error-box');
      var errorMsg = document.getElementById('error-msg');
      var spinner = document.getElementById('spinner');
      var btnText = document.getElementById('btn-text');
      var submitBtn = document.getElementById('submit-btn');

      function showError(msg) {
        errorMsg.textContent = msg;
        errorBox.classList.remove('hidden');
      }

      errorBox.classList.add('hidden');

      if (!name || !businessName || !phone || !email || !password || !confirmPassword) {
        showError('กรุณากรอกข้อมูลให้ครบทุกช่อง');
        return;
      }
      if (password.length < 6) {
        showError('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
        return;
      }
      if (password !== confirmPassword) {
        showError('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');
        return;
      }

      spinner.style.display = 'block';
      btnText.textContent = 'กำลังสมัครสมาชิก...';
      submitBtn.disabled = true;

      try {
        var res = await fetch(API + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, businessName: businessName, phone: phone, email: email, password: password })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.message || data.error || 'สมัครสมาชิกไม่สำเร็จ');
        saveAdminSession(data.token, data.operator);
        location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่');
        spinner.style.display = 'none';
        btnText.textContent = 'สมัครสมาชิก';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
