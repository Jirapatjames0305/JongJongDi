<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผู้ประกอบการ – JongJongDi Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="_lib.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Prompt, sans-serif; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    thead th { background: #f8fafc; padding: 11px 14px; text-align: left; font-weight: 600; color: #475569; font-size: 13px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 14px; vertical-align: middle; color: #334155; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .badge-yellow { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    .badge-green  { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge-red    { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .tab-pill { display: inline-block; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; font-family: Prompt, sans-serif; transition: background .12s, color .12s; }
    .tab-pill.active   { background: #2563eb; color: #fff; }
    .tab-pill.inactive { background: transparent; color: #64748b; }
    .tab-pill.inactive:hover { color: #334155; background: #f1f5f9; }
    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 60px 20px; color: #94a3b8; }
    .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
    .btn-action { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; font-family: Prompt, sans-serif; border: 1px solid; cursor: pointer; transition: opacity .12s; white-space: nowrap; }
    .btn-action:hover { opacity: .8; }
    .btn-green { background: #f0fdf4; color: #16a34a; border-color: #86efac; }
    .btn-red   { background: #fff1f2; color: #dc2626; border-color: #fca5a5; }
    .btn-blue  { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
    .btn-save  { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 7px; font-size: 12px; font-weight: 500; font-family: Prompt, sans-serif; background: #2563eb; color: #fff; border: none; cursor: pointer; margin-left: 6px; transition: background .12s; }
    .btn-save:hover { background: #1d4ed8; }
    .comm-input { width: 64px; padding: 4px 7px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 13px; font-family: Prompt, sans-serif; text-align: center; }
    .comm-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
  </style>
</head>
<body>
<script>
(function () {
  var shell = renderAdminShell({ activePage: 'operators.html', requireSuperAdmin: true });
  if (!shell) return;

  var currentStatus = '';

  var STATUS_TABS = [
    { label: 'ทั้งหมด',        value: '' },
    { label: 'รอการอนุมัติ',   value: 'PENDING' },
    { label: 'ใช้งานได้',      value: 'ACTIVE' },
    { label: 'ระงับ',          value: 'SUSPENDED' }
  ];

  var STATUS_BADGE = {
    PENDING:   '<span class="badge badge-yellow"><i class="fa-solid fa-clock"></i>รอการอนุมัติ</span>',
    ACTIVE:    '<span class="badge badge-green"><i class="fa-solid fa-circle-check"></i>ใช้งานได้</span>',
    SUSPENDED: '<span class="badge badge-red"><i class="fa-solid fa-ban"></i>ระงับ</span>'
  };

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildTabs() {
    return STATUS_TABS.map(function (t) {
      var active = t.value === currentStatus;
      return '<button class="tab-pill ' + (active ? 'active' : 'inactive') + '" data-status="' + t.value + '">' + t.label + '</button>';
    }).join('');
  }

  function renderShell() {
    document.getElementById('page-content').innerHTML +=
      '<div style="margin-bottom:20px">' +
        '<h1 style="margin:0;font-size:22px;font-weight:700;color:#0f172a">ผู้ประกอบการ</h1>' +
        '<div style="font-size:13px;color:#64748b;margin-top:3px">จัดการและอนุมัติผู้ประกอบการที่สมัครเข้ามา</div>' +
      '</div>' +
      '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px" id="tab-row">' +
        buildTabs() +
      '</div>' +
      '<div id="tbl-area"></div>';

    attachTabEvents();
  }

  function attachTabEvents() {
    document.getElementById('tab-row').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-status]');
      if (!btn) return;
      currentStatus = btn.dataset.status;
      document.getElementById('tab-row').innerHTML = buildTabs();
      attachTabEvents();
      loadOperators();
    });
  }

  function setLoading() {
    document.getElementById('tbl-area').innerHTML =
      '<div style="text-align:center;padding:60px 0"><div class="spinner"></div></div>';
  }

  function actionButton(op) {
    if (op.status === 'PENDING') {
      return '<button class="btn-action btn-green" data-id="' + op.id + '" data-action="approve">' +
               '<i class="fa-solid fa-check"></i>อนุมัติ' +
             '</button>';
    }
    if (op.status === 'ACTIVE') {
      return '<button class="btn-action btn-red" data-id="' + op.id + '" data-action="suspend">' +
               '<i class="fa-solid fa-ban"></i>ระงับ' +
             '</button>';
    }
    if (op.status === 'SUSPENDED') {
      return '<button class="btn-action btn-blue" data-id="' + op.id + '" data-action="reactivate">' +
               '<i class="fa-solid fa-play"></i>เปิดใช้งาน' +
             '</button>';
    }
    return '';
  }

  function renderTable(operators) {
    if (!operators || operators.length === 0) {
      document.getElementById('tbl-area').innerHTML =
        '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>ไม่พบผู้ประกอบการ</div>';
      return;
    }

    var rows = operators.map(function (op) {
      var roomCount  = (op._count && op._count.rooms)  || 0;
      var tourCount  = (op._count && op._count.tours)  || 0;
      var badge      = STATUS_BADGE[op.status] || escHtml(op.status);
      var commVal    = op.commissionRate != null ? op.commissionRate : 0;

      return '<tr>' +
        '<td>' +
          '<div style="font-weight:600;color:#0f172a">' + escHtml(op.name) + '</div>' +
          '<div style="font-size:12px;color:#64748b;margin-top:2px">' + escHtml(op.businessName || '-') + '</div>' +
        '</td>' +
        '<td>' +
          '<div style="font-size:13px">' + escHtml(op.email) + '</div>' +
          '<div style="font-size:12px;color:#64748b;margin-top:2px">' + escHtml(op.phone || '-') + '</div>' +
        '</td>' +
        '<td>' + badge + '</td>' +
        '<td style="white-space:nowrap">' +
          '<input class="comm-input" type="number" min="0" max="100" step="0.1" ' +
            'data-id="' + op.id + '" data-orig="' + commVal + '" value="' + commVal + '" />' +
          '<button class="btn-save" data-id="' + op.id + '" data-action="save-comm" style="display:none">' +
            '<i class="fa-solid fa-floppy-disk"></i>บันทึก' +
          '</button>' +
        '</td>' +
        '<td style="color:#475569;font-size:13px">' +
          '<span style="font-weight:500">' + roomCount + '</span> ที่พัก / ' +
          '<span style="font-weight:500">' + tourCount + '</span> ทัวร์' +
        '</td>' +
        '<td style="white-space:nowrap;color:#475569;font-size:13px">' + fmtDate(op.createdAt) + '</td>' +
        '<td>' + actionButton(op) + '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('tbl-area').innerHTML =
      '<div class="table-wrap">' +
        '<table>' +
          '<thead><tr>' +
            '<th>ชื่อ / ธุรกิจ</th>' +
            '<th>ติดต่อ</th>' +
            '<th>สถานะ</th>' +
            '<th>ค่าคอม (%)</th>' +
            '<th>ที่พัก / ทัวร์</th>' +
            '<th>วันที่สมัคร</th>' +
            '<th>การดำเนินการ</th>' +
          '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>';

    attachTableEvents();
  }

  function attachTableEvents() {
    var area = document.getElementById('tbl-area');

    // Commission input: show/hide save button
    area.querySelectorAll('input.comm-input').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var id      = inp.dataset.id;
        var orig    = parseFloat(inp.dataset.orig);
        var current = parseFloat(inp.value);
        var saveBtn = area.querySelector('.btn-save[data-id="' + id + '"]');
        if (saveBtn) {
          saveBtn.style.display = (current !== orig && !isNaN(current)) ? '' : 'none';
        }
      });
    });

    // Action buttons (approve / suspend / reactivate / save-comm)
    area.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      var id     = btn.dataset.id;
      var action = btn.dataset.action;

      if (action === 'approve') {
        patchStatus(id, 'ACTIVE');
      } else if (action === 'suspend') {
        patchStatus(id, 'SUSPENDED');
      } else if (action === 'reactivate') {
        patchStatus(id, 'ACTIVE');
      } else if (action === 'save-comm') {
        var inp = area.querySelector('input.comm-input[data-id="' + id + '"]');
        if (!inp) return;
        var rate = parseFloat(inp.value);
        if (isNaN(rate) || rate < 0 || rate > 100) {
          showToast('กรุณากรอกค่าคอมมิสชั่นที่ถูกต้อง (0-100)', 'error');
          return;
        }
        btn.disabled = true;
        adminPatch('/api/operators/' + id, { commissionRate: rate }).then(function () {
          inp.dataset.orig = rate;
          btn.style.display = 'none';
          btn.disabled = false;
          showToast('บันทึกค่าคอมมิสชั่นแล้ว');
        }).catch(function (err) {
          btn.disabled = false;
          showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
        });
      }
    });
  }

  function patchStatus(id, status) {
    adminPatch('/api/operators/' + id, { status: status }).then(function () {
      var label = { ACTIVE: 'อนุมัติแล้ว', SUSPENDED: 'ระงับแล้ว' }[status] || 'อัปเดตแล้ว';
      showToast(label);
      loadOperators();
    }).catch(function (err) {
      showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
    });
  }

  function loadOperators() {
    setLoading();
    var qs = currentStatus ? '?status=' + encodeURIComponent(currentStatus) : '';
    adminGet('/api/operators' + qs).then(function (data) {
      var list = Array.isArray(data) ? data : (data.operators || []);
      renderTable(list);
    }).catch(function (err) {
      document.getElementById('tbl-area').innerHTML =
        '<div style="padding:40px;text-align:center;color:#dc2626">' +
        '<i class="fa-solid fa-circle-exclamation" style="margin-right:8px"></i>' + escHtml(err.message) + '</div>';
    });
  }

  renderShell();
  loadOperators();
})();
</script>
</body>
</html>
