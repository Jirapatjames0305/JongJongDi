<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายได้ของฉัน – JongJongDi Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="_lib.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Prompt, sans-serif; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; }
    thead th { background: #f8fafc; padding: 11px 14px; text-align: left; font-weight: 600; color: #475569; font-size: 13px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f1f5f9; transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 12px 14px; vertical-align: middle; color: #334155; }
    tfoot tr { border-top: 2px solid #e2e8f0; background: #f8fafc; }
    tfoot td { padding: 12px 14px; font-weight: 700; color: #0f172a; font-size: 14px; }
    .stat-card { flex: 1; min-width: 160px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; }
    .stat-label { font-size: 13px; color: #64748b; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; }
    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 48px 20px; background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; color: #92400e; }
    .empty-state i { font-size: 36px; margin-bottom: 10px; display: block; color: #f59e0b; }
    input[type=month].mon-input { padding: 7px 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: Prompt, sans-serif; color: #334155; background: #fff; cursor: pointer; }
    input[type=month].mon-input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px #bfdbfe; }
    .btn-csv { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: #f0fdf4; color: #16a34a; font-size: 14px; font-weight: 500; font-family: Prompt, sans-serif; border: 1px solid #86efac; cursor: pointer; transition: background .12s; }
    .btn-csv:hover { background: #dcfce7; }
    .chip-type { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .chip-room { background: #eff6ff; color: #2563eb; }
    .chip-tour { background: #f0fdf4; color: #16a34a; }
  </style>
</head>
<body>
<script>
(function () {
  var shell = renderAdminShell({ activePage: 'revenue.html' });
  if (!shell) return;

  var METHOD_LABEL = {
    BANK_TRANSFER: 'โอนธนาคาร',
    PROMPTPAY:     'PromptPay',
    CREDIT_CARD:   'บัตรเครดิต',
    ALIPAY:        'Alipay',
    WECHAT_PAY:    'WeChat Pay'
  };

  var now = new Date();
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  var defaultMonth = now.getFullYear() + '-' + pad(now.getMonth() + 1);

  var currentData = null;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderShell() {
    document.getElementById('page-content').innerHTML +=
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">' +
        '<div>' +
          '<h1 style="margin:0;font-size:22px;font-weight:700;color:#0f172a">รายได้ของฉัน</h1>' +
          '<div id="biz-name" style="font-size:13px;color:#64748b;margin-top:3px"></div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<input type="month" class="mon-input" id="mon-picker" value="' + defaultMonth + '" />' +
          '<button class="btn-csv" id="btn-csv">' +
            '<i class="fa-solid fa-file-csv"></i>Export CSV' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div id="stats-row" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px"></div>' +
      '<div id="tbl-area"></div>';

    document.getElementById('mon-picker').addEventListener('change', function () {
      loadRevenue(this.value);
    });

    document.getElementById('btn-csv').addEventListener('click', exportCsv);
  }

  function renderStats(data) {
    var commPct = data.operator && data.operator.commissionRate != null
      ? data.operator.commissionRate : 0;
    document.getElementById('stats-row').innerHTML =
      '<div class="stat-card">' +
        '<div class="stat-label"><i class="fa-solid fa-coins" style="color:#2563eb;margin-right:6px"></i>รายได้รวม</div>' +
        '<div class="stat-value" style="color:#2563eb">฿' + fmt(data.gross || 0) + '</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label"><i class="fa-solid fa-percent" style="color:#f59e0b;margin-right:6px"></i>หักค่าคอม ' + commPct + '%</div>' +
        '<div class="stat-value" style="color:#f59e0b">฿' + fmt(data.commission || 0) + '</div>' +
      '</div>' +
      '<div class="stat-card">' +
        '<div class="stat-label"><i class="fa-solid fa-hand-holding-dollar" style="color:#16a34a;margin-right:6px"></i>ยอดรับสุทธิ</div>' +
        '<div class="stat-value" style="color:#16a34a;font-size:26px">฿' + fmt(data.net || 0) + '</div>' +
      '</div>';
  }

  function typeChip(type) {
    if (type === 'ACCOMMODATION') return '<span class="chip-type chip-room">ที่พัก</span>';
    if (type === 'TOUR')          return '<span class="chip-type chip-tour">ทัวร์</span>';
    return '<span class="chip-type" style="background:#f1f5f9;color:#475569">' + escHtml(type) + '</span>';
  }

  function renderTable(data) {
    var lines = data.lines || [];
    if (lines.length === 0) {
      document.getElementById('tbl-area').innerHTML =
        '<div class="empty-state">' +
          '<i class="fa-solid fa-triangle-exclamation"></i>' +
          '<div style="font-size:15px;font-weight:600">ไม่มีรายการสำหรับเดือนที่เลือก</div>' +
          '<div style="font-size:13px;margin-top:4px">ลองเลือกเดือนอื่นดูครับ</div>' +
        '</div>';
      return;
    }

    var totalAmt = 0;
    var rows = lines.map(function (ln) {
      totalAmt += ln.amount || 0;
      var method = METHOD_LABEL[ln.method] || escHtml(ln.method || '-');
      return '<tr>' +
        '<td style="font-family:\'Courier New\',monospace;font-size:13px;font-weight:600;color:#1e3a8a;letter-spacing:.5px">' +
          escHtml(ln.bookingNumber) +
        '</td>' +
        '<td>' + typeChip(ln.type) + '</td>' +
        '<td style="max-width:180px">' +
          '<div style="font-weight:500;color:#0f172a">' + escHtml(ln.itemName || '-') + '</div>' +
        '</td>' +
        '<td style="color:#475569">' + escHtml(ln.guestName || '-') + '</td>' +
        '<td style="font-size:13px;color:#64748b">' + escHtml(method) + '</td>' +
        '<td style="white-space:nowrap;font-size:13px;color:#475569">' + fmtDate(ln.approvedAt) + '</td>' +
        '<td style="white-space:nowrap;font-weight:600;color:#0f172a;text-align:right">฿' + fmt(ln.amount) + '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('tbl-area').innerHTML =
      '<div class="table-wrap">' +
        '<table>' +
          '<thead><tr>' +
            '<th>เลขที่จอง</th>' +
            '<th>ประเภท</th>' +
            '<th>รายการ</th>' +
            '<th>ลูกค้า</th>' +
            '<th>ช่องทาง</th>' +
            '<th>วันอนุมัติ</th>' +
            '<th style="text-align:right">ยอด</th>' +
          '</tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
          '<tfoot><tr>' +
            '<td colspan="6">รวมทั้งหมด (' + lines.length + ' รายการ)</td>' +
            '<td style="white-space:nowrap;text-align:right">฿' + fmt(totalAmt) + '</td>' +
          '</tr></tfoot>' +
        '</table>' +
      '</div>';
  }

  function setLoading() {
    document.getElementById('stats-row').innerHTML = '';
    document.getElementById('tbl-area').innerHTML =
      '<div style="text-align:center;padding:60px 0"><div class="spinner"></div></div>';
  }

  function loadRevenue(month) {
    setLoading();
    currentData = null;
    adminGet('/api/payouts/me?month=' + encodeURIComponent(month)).then(function (data) {
      currentData = data;
      if (data.operator && data.operator.businessName) {
        document.getElementById('biz-name').textContent = data.operator.businessName;
      }
      renderStats(data);
      renderTable(data);
    }).catch(function (err) {
      document.getElementById('tbl-area').innerHTML =
        '<div style="padding:40px;text-align:center;color:#dc2626">' +
        '<i class="fa-solid fa-circle-exclamation" style="margin-right:8px"></i>' + escHtml(err.message) + '</div>';
    });
  }

  function exportCsv() {
    if (!currentData) {
      showToast('ยังไม่มีข้อมูล', 'error');
      return;
    }

    var month = document.getElementById('mon-picker').value || defaultMonth;
    var lines = currentData.lines || [];
    var commPct = currentData.operator && currentData.operator.commissionRate != null
      ? currentData.operator.commissionRate : 0;

    var METHOD_LABEL_LOCAL = {
      BANK_TRANSFER: 'โอนธนาคาร',
      PROMPTPAY:     'PromptPay',
      CREDIT_CARD:   'บัตรเครดิต',
      ALIPAY:        'Alipay',
      WECHAT_PAY:    'WeChat Pay'
    };

    var TYPE_LABEL = { ACCOMMODATION: 'ที่พัก', TOUR: 'ทัวร์' };

    function csvCell(s) {
      var str = String(s == null ? '' : s);
      if (str.indexOf(',') >= 0 || str.indexOf('"') >= 0 || str.indexOf('\n') >= 0) {
        return '"' + str.replace(/"/g, '""') + '"';
      }
      return str;
    }

    var csvRows = [];
    csvRows.push(['เลขที่จอง','ประเภท','รายการ','ลูกค้า','ช่องทาง','วันอนุมัติ','ยอด'].map(csvCell).join(','));

    lines.forEach(function (ln) {
      csvRows.push([
        ln.bookingNumber,
        TYPE_LABEL[ln.type] || ln.type,
        ln.itemName,
        ln.guestName,
        METHOD_LABEL_LOCAL[ln.method] || ln.method,
        ln.approvedAt ? fmtDate(ln.approvedAt) : '',
        ln.amount != null ? ln.amount : 0
      ].map(csvCell).join(','));
    });

    csvRows.push('');
    csvRows.push([csvCell('รายได้รวม'), csvCell('฿' + fmt(currentData.gross || 0))].join(','));
    csvRows.push([csvCell('หักค่าคอม ' + commPct + '%'), csvCell('฿' + fmt(currentData.commission || 0))].join(','));
    csvRows.push([csvCell('ยอดรับสุทธิ'), csvCell('฿' + fmt(currentData.net || 0))].join(','));

    var bom = '﻿';
    var content = bom + csvRows.join('\r\n');
    var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href     = url;
    a.download = 'revenue-' + month + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  renderShell();
  loadRevenue(defaultMonth);
})();
</script>
</body>
</html>
