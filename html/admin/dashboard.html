<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แดชบอร์ด – JongJongDi Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Prompt', sans-serif; background: #f8fafc; color: #1e293b; }
  </style>
  <script src="_lib.js"></script>
</head>
<body>
<script>
(async function () {
  // ── Auth guard ───────────────────────────────────────────────────────────
  const token = adminToken();
  const operatorRaw = localStorage.getItem('jjd_operator');
  if (!token || !operatorRaw) {
    window.location.href = 'login.html';
    return;
  }
  const operator = JSON.parse(operatorRaw);

  // ── Render shell (sidebar + topbar) ────────────────────────────────────
  renderAdminShell({ activePage: 'dashboard.html' });

  const content = document.getElementById('page-content');

  // ── Loading placeholder ─────────────────────────────────────────────────
  content.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:center;min-height:320px;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size:28px;color:#2563eb;"></i>
    </div>`;

  // ── Fetch stats + bookings in parallel ──────────────────────────────────
  const [stats, bookingsData] = await Promise.all([
    adminGet('/api/operators/stats'),
    adminGet('/api/bookings/admin/list?page=1'),
  ]);

  const s = stats || { rooms: 0, tours: 0, bookings: 0, pendingBookings: 0 };
  const recentBookings = (bookingsData?.bookings || []).slice(0, 5);

  // ── Helpers ─────────────────────────────────────────────────────────────
  const roleLabel = operator.role === 'SUPER_ADMIN' ? 'Super Admin' : 'ผู้ประกอบการ';

  function itemName(b) {
    if (b.type === 'ACCOMMODATION' && b.room) return b.room.nameTh;
    if (b.type === 'DIVE_TOUR' && b.tourSchedule?.tour) return b.tourSchedule.tour.nameTh;
    return '—';
  }

  function bookingIconHtml(type) {
    if (type === 'ACCOMMODATION') {
      return `<div style="width:40px;height:40px;border-radius:10px;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i class="fa-solid fa-bed" style="color:#2563eb;font-size:16px;"></i>
      </div>`;
    }
    return `<div style="width:40px;height:40px;border-radius:10px;background:#ecfeff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <i class="fa-solid fa-water-ladder" style="color:#0891b2;font-size:16px;"></i>
    </div>`;
  }

  function shortDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
  }

  // ── Build page HTML ─────────────────────────────────────────────────────
  content.innerHTML = `
    <!-- Greeting -->
    <div style="margin-bottom:28px;">
      <h1 style="font-size:22px;font-weight:700;color:#1e293b;line-height:1.3;">สวัสดี, ${operator.name} 👋</h1>
      <p style="margin-top:4px;font-size:14px;color:#64748b;">${operator.businessName} · ${roleLabel}</p>
    </div>

    <!-- Stat cards -->
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-bottom:28px;" id="stat-grid">
      <!-- การจองทั้งหมด -->
      <div style="background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;display:flex;align-items:center;gap:16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:#eff6ff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="fa-solid fa-calendar-check" style="color:#2563eb;font-size:18px;"></i>
        </div>
        <div>
          <div style="font-size:26px;font-weight:700;color:#1e293b;line-height:1.1;">${fmt(s.bookings)}</div>
          <div style="font-size:13px;color:#64748b;margin-top:2px;">การจองทั้งหมด</div>
        </div>
      </div>

      <!-- รอดำเนินการ -->
      <div style="background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;display:flex;align-items:center;gap:16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:#fefce8;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="fa-solid fa-clock" style="color:#d97706;font-size:18px;"></i>
        </div>
        <div>
          <div style="font-size:26px;font-weight:700;color:#1e293b;line-height:1.1;">${fmt(s.pendingBookings)}</div>
          <div style="font-size:13px;color:#64748b;margin-top:2px;">รอดำเนินการ</div>
        </div>
      </div>

      <!-- ที่พัก -->
      <div style="background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;display:flex;align-items:center;gap:16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="fa-solid fa-bed" style="color:#16a34a;font-size:18px;"></i>
        </div>
        <div>
          <div style="font-size:26px;font-weight:700;color:#1e293b;line-height:1.1;">${fmt(s.rooms)}</div>
          <div style="font-size:13px;color:#64748b;margin-top:2px;">ที่พัก</div>
        </div>
      </div>

      <!-- ทัวร์ -->
      <div style="background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;display:flex;align-items:center;gap:16px;">
        <div style="width:40px;height:40px;border-radius:12px;background:#ecfeff;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="fa-solid fa-water-ladder" style="color:#0891b2;font-size:18px;"></i>
        </div>
        <div>
          <div style="font-size:26px;font-weight:700;color:#1e293b;line-height:1.1;">${fmt(s.tours)}</div>
          <div style="font-size:13px;color:#64748b;margin-top:2px;">ทัวร์</div>
        </div>
      </div>
    </div>

    <!-- Quick actions -->
    <div style="background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;margin-bottom:28px;">
      <h2 style="font-size:15px;font-weight:600;color:#1e293b;margin-bottom:16px;">การดำเนินการด่วน</h2>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;" id="qa-grid">
        <a href="rooms.html" style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#eff6ff;border-radius:12px;text-decoration:none;transition:opacity .2s;" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">
          <i class="fa-solid fa-bed" style="color:#2563eb;font-size:18px;width:20px;text-align:center;"></i>
          <span style="font-size:14px;font-weight:500;color:#2563eb;">จัดการที่พัก</span>
        </a>
        <a href="tours.html" style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#ecfeff;border-radius:12px;text-decoration:none;transition:opacity .2s;" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">
          <i class="fa-solid fa-water-ladder" style="color:#0891b2;font-size:18px;width:20px;text-align:center;"></i>
          <span style="font-size:14px;font-weight:500;color:#0891b2;">จัดการทัวร์</span>
        </a>
        <a href="bookings.html" style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f8fafc;border-radius:12px;text-decoration:none;transition:opacity .2s;" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">
          <i class="fa-solid fa-list" style="color:#475569;font-size:18px;width:20px;text-align:center;"></i>
          <span style="font-size:14px;font-weight:500;color:#475569;">ดูการจอง</span>
        </a>
        <a href="settings.html" style="display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f8fafc;border-radius:12px;text-decoration:none;transition:opacity .2s;" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='1'">
          <i class="fa-solid fa-gear" style="color:#475569;font-size:18px;width:20px;text-align:center;"></i>
          <span style="font-size:14px;font-weight:500;color:#475569;">ตั้งค่าบัญชี</span>
        </a>
      </div>
    </div>

    <!-- Recent bookings -->
    <div style="background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h2 style="font-size:15px;font-weight:600;color:#1e293b;">การจองล่าสุด</h2>
        <a href="bookings.html" style="font-size:13px;color:#2563eb;text-decoration:none;font-weight:500;">ดูทั้งหมด <i class="fa-solid fa-arrow-right" style="font-size:11px;"></i></a>
      </div>
      <div id="recent-bookings-list">
        ${recentBookings.length === 0 ? `
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;gap:12px;">
            <i class="fa-regular fa-calendar-xmark" style="font-size:36px;color:#cbd5e1;"></i>
            <div style="font-size:15px;font-weight:500;color:#94a3b8;">ยังไม่มีการจอง</div>
            <div style="font-size:13px;color:#cbd5e1;text-align:center;">เมื่อมีการจองใหม่จะแสดงที่นี่</div>
          </div>
        ` : recentBookings.map((b, idx) => `
          <a href="booking-detail.html?num=${encodeURIComponent(b.bookingNumber)}"
             style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;text-decoration:none;${idx < recentBookings.length - 1 ? 'border-bottom:1px solid #f1f5f9;' : ''}">
            <div style="display:flex;align-items:center;gap:12px;min-width:0;flex:1;">
              ${bookingIconHtml(b.type)}
              <div style="min-width:0;">
                <div style="font-size:14px;font-weight:600;color:#1e293b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.guestName}</div>
                <div style="font-size:12px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${b.bookingNumber} · ${itemName(b)}</div>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;">
              <div style="font-size:14px;font-weight:600;color:#2563eb;">฿${fmt(b.totalAmount)}</div>
              <div style="font-size:11px;color:#94a3b8;">${shortDate(b.createdAt)}</div>
              ${bookingStatusBadge(b.status)}
            </div>
          </a>
        `).join('')}
      </div>
    </div>
  `;

  // ── Responsive: 4-col on wide screens ───────────────────────────────────
  function applyGridResponsive() {
    const wide = window.innerWidth >= 768;
    const statGrid = document.getElementById('stat-grid');
    const qaGrid = document.getElementById('qa-grid');
    if (statGrid) statGrid.style.gridTemplateColumns = wide ? 'repeat(4,1fr)' : 'repeat(2,1fr)';
    if (qaGrid) qaGrid.style.gridTemplateColumns = wide ? 'repeat(4,1fr)' : 'repeat(2,1fr)';
  }
  applyGridResponsive();
  window.addEventListener('resize', applyGridResponsive);
})();
</script>
</body>
</html>
